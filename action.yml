name: RudderStack SDK E2E
description: Dispatch the central SDK validation workflow and wait for its exact result.

inputs:
  token:
    description: GitHub App token with Actions write access to rudderlabs/rudder-sdk-e2e-tests.
    required: true
  suite:
    description: reliability runs local delivery checks; full also runs live pipeline checks.
    default: reliability
  package-version:
    description: Exact stable published SDK package version to validate.
  source-sha:
    description: Optional full lowercase release commit SHA for published-package validation only; defaults to the event SHA.
  pr-number:
    description: Optional PR number for a trusted caller selecting an explicit PR candidate; requires merge-sha.
  merge-sha:
    description: Optional current PR merge commit SHA; requires pr-number.
  timeout-seconds:
    description: Maximum wait for central validation, from 1 to 3000 seconds.
    default: '3000'

outputs:
  run-id:
    description: The exact dispatched workflow run ID.
    value: ${{ steps.dispatch.outputs.run-id }}
  run-url:
    description: Link to the exact dispatched workflow run.
    value: ${{ steps.dispatch.outputs.run-url }}

runs:
  using: composite
  steps:
    - name: Dispatch SDK validation and wait
      id: dispatch
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.token }}
        SDK_E2E_SUITE: ${{ inputs.suite }}
        SDK_E2E_PACKAGE_VERSION: ${{ inputs.package-version }}
        SDK_E2E_SOURCE_SHA: ${{ inputs.source-sha }}
        SDK_E2E_PR_NUMBER: ${{ inputs.pr-number }}
        SDK_E2E_MERGE_SHA: ${{ inputs.merge-sha }}
        SDK_E2E_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: python3 "$ACTION_PATH/scripts/dispatch.py"
